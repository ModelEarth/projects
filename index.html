	<script>
	// Each project area is a README in plan/, shown in its own bar. The bar title comes from here, not the
	// file, so the editor doesn't change it. To add an area, add its div in #projectPlans and a line below.
	loadMarkdown('plan/README.md', 'projectsIntro', { buttonText: 'Edit' });
	loadMarkdown('plan/focus.md', 'planFocus', { title: 'Get Involved!', buttonText: 'Edit' }); // Not numbered, outside #projectPlans
	loadMarkdown('plan/mcp.md', 'planMcp', { title: 'MCP for Impact Video Training (MCP)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/js.md', 'planJs', { title: 'Data Visualization (JS)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/ai.md', 'planAi', { title: 'CodeChat RAG for LLMs (AI)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/ml.md', 'planMl', { title: 'RealityStream Machine Learning (ML)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/io.md', 'planIo', { title: 'International Trade Flow (IO)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/geo.md', 'planGeo', { title: 'Open Footprint Labels (Geo)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/feed.md', 'planFeed', { title: 'FeedPlayer with MemberSense (Feed)', buttonText: 'Edit' }, undefined, numberProjectBars);
	loadMarkdown('plan/moon.md', 'planMoon', { title: 'Moonshot Challenges (Moon)', buttonText: 'Edit' }, undefined, numberProjectBars);

	// Numbers each bar by its place in #projectPlans, so the numbers adjust when a bar is added.
	// Runs as each file loads, since they can arrive in any order.
	function numberProjectBars() {
		var plans = document.querySelectorAll('#projectPlans > div');
		plans.forEach(function(plan, i) {
			var bar = plan.querySelector(':scope > h2');
			if (!bar) return; // Not loaded yet
			var num = bar.querySelector('.barNum');
			if (!num) {
				num = document.createElement('span');
				num.className = 'barNum';
				bar.insertBefore(num, bar.firstChild);
			}
			num.textContent = (i + 1) + '. ';
		});
	}
	</script>

	<script>
	// Create GitHub cmds for downloading missing local repos.
	document.addEventListener('DOMContentLoaded', function () {
		// The plan/ files load on their own, so links are collected when the check is clicked.
		waitForElm('#activeDiv').then((elm) => {
			const website = location.host;
			const projectsDiv = document.getElementById('activeDiv');
			const missingReposFound = document.getElementById('missingReposFound');
			const localsiteView = document.getElementById('localsiteView');
			const checkLocalReposBtn = document.getElementById('checkLocalReposBtn');
			const localRepoCheckNote = document.getElementById('localRepoCheckNote');
			const links = projectsDiv.getElementsByTagName('a');

			const repoArray = [];
			const repoCount = {};
			const presentRepos = [];
			const presentRepoCount = {};
			const missingRepos = [];
			const missingRepoCount = {};

			// Build repoArray and repoCount
			const collectRepos = () => {
				repoArray.length = 0;
				Object.keys(repoCount).forEach((key) => delete repoCount[key]);
				for (let link of links) {
					if (link.href.includes(location.host)) {
						// Get links pointed at current domain (typically localhost:8887)
						const path = new URL(link.href).pathname.split('/');
						const folder = path[1]; // Top level parent folder

						if (folder && !repoArray.includes(folder)) {
							repoArray.push(folder);
						}

						repoCount[folder] = (repoCount[folder] || 0) + 1;
					}
				}
			};

			// Check for missing repos and build missingRepoCount
			const checkRepos = async () => {
				collectRepos();
				presentRepos.length = 0;
				missingRepos.length = 0;
				Object.keys(presentRepoCount).forEach((key) => delete presentRepoCount[key]);
				Object.keys(missingRepoCount).forEach((key) => delete missingRepoCount[key]);

				console.log("The following errors are By Design for the list of missing repos.")
				for (let i = 0; i < repoArray.length; i++) {
					const folder = repoArray[i];
					if (folder !== 'localsite') {
						try {
							const response = await fetch(`http://${website}/${folder}/`);
							if (!response.ok) {
								throw new Error('Not Found');
							}
							// These are the ones found
							presentRepos.push(folder);
							presentRepoCount[folder] = repoCount[folder];
						} catch (error) {
							missingRepos.push(folder);
							missingRepoCount[folder] = repoCount[folder];
						}
					}
				}
				displayAllRepos();

				missingReposFound.style.display = 'block';
				displayMissingRepos();
				buildCloneCommands();
				if (missingRepos.length > 0) {
					
				} else {
					allReposPresent.style.display = 'block';
				}
				if (location.host.includes('localhost')) {
					localsiteView.style.display = 'block';
				}
			};

			// Display all repos
			const displayAllRepos = () => {
				const allReposDiv = document.getElementById('allReposPresent');
				let html = '<h2>Model.earth repos</h2>List of repos mentioned above. More at: <a href="https://github.com/ModelEarth?tab=repositories">github.com/modelearth</a><br>';
				html += '<ul>';
				for (let folder of repoArray) {
					html += `<li><a href="https://github.com/modelearth/${folder}">https://github.com/modelearth/${folder}</a> (Links: ${repoCount[folder]}) - <a href='https://gitdiagram.com/modelearth/${folder}'>GitDiagram</a></li>`;
				}
				html += '</ul>';
				allReposDiv.innerHTML = html;
			};

			// Display missing repos
			const displayMissingRepos = () => {
				const missingReposDiv = document.getElementById('missingRepos');
				let html = '<ul>';
				for (let folder of missingRepos) {
					html += `<li><a href="https://github.com/modelearth/${folder}">https://github.com/modelearth/${folder}</a> (Links: ${missingRepoCount[folder]}) - <a href='https://gitdiagram.com/modelearth/${folder}'>GitDiagram</a></li>`;
				}
				html += '</ul>';
				missingReposDiv.innerHTML = html;
			};

			// Build and display clone commands
			const buildCloneCommands = () => {
				let githubCloneCmds = '';
				for (let folder of missingRepos) {
					githubCloneCmds += `git clone https://github.com/modelearth/${folder} ${folder} &&\r`;
				}
				githubCloneCmds = githubCloneCmds.slice(0, -4); // Remove the trailing " &&"

				const cloneMissingReposTextbox = document.getElementById('cloneMissingRepos');
				cloneMissingReposTextbox.value = githubCloneCmds;

				let boldTitle = document.getElementById('cloneMissingReposTitle');
				if (!boldTitle) {
					boldTitle = document.createElement('div');
					boldTitle.id = 'cloneMissingReposTitle';
					boldTitle.className = 'bold-title';
					cloneMissingReposTextbox.insertAdjacentElement('beforebegin', boldTitle);
				}
				boldTitle.textContent =
					'You can run in your webroot to clone additional repos featured above.';
			};

			// Start local checks only after an explicit user click.
			if (checkLocalReposBtn) {
				checkLocalReposBtn.addEventListener('click', async () => {
					checkLocalReposBtn.disabled = true;
					checkLocalReposBtn.textContent = 'Checking...';
					if (localRepoCheckNote) {
						localRepoCheckNote.textContent = 'Checking your local folders...';
					}
					await checkRepos();
					checkLocalReposBtn.textContent = 'Check Local Repos Again';
					checkLocalReposBtn.disabled = false;
					if (localRepoCheckNote) {
						localRepoCheckNote.textContent = 'Local repo check complete.';
					}
				});
			}
		});
	});
	</script>
